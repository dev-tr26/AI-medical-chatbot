name: Python CI/CD Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$(pwd)
          mkdir -p tests/logs/unit
          pytest tests/unit --log-cli-level=INFO --disable-warnings \
            | tee tests/logs/unit/unit_tests.log

      - name: Upload Unit Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: tests/logs/unit/

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Integration Tests
        run: |
          export PYTHONPATH=$(pwd)
          mkdir -p tests/logs/integration
          pytest tests/integration --log-cli-level=INFO --disable-warnings \
            | tee tests/logs/integration/integration_tests.log

      - name: Upload Integration Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: tests/logs/integration/

  performance-tests:
    name: Run Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Performance Tests
        run: |
          export PYTHONPATH=$(pwd)
          mkdir -p tests/logs/performance
          pytest tests/performance --log-cli-level=INFO --disable-warnings \
            | tee tests/logs/performance/performance_tests.log

      - name: Upload Performance Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-logs
          path: tests/logs/performance/
